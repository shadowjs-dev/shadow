[package]
name = "shadow-compiler-node"
description = "Node.js addon for the ShadowJS compiler (napi-rs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "shadow_compiler_node"
crate-type = ["cdylib"]

[dependencies]
shadow-compiler = { path = "../shadow-compiler" }
napi = { version = "=3.14.2", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.12"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mimalloc.workspace = true

[build-dependencies]
napi-build = "=2.6.0"

[lints]
workspace = true
