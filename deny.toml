# Checked by `cargo deny check` in CI (the `rust` job): the licenses of the Rust dependency tree, banned or duplicated crates,
# crate sources and known advisories. The npm side is checked separately.

[licenses]
# Permissive licenses only. A crate that offers a choice (for example "MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes through
# the permissive option.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The three crates of this workspace depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
yanked = "deny"
