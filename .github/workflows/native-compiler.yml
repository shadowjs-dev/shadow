# The Rust compiler, on its own workflow so that it runs when it changes (and by hand), not on every push: formatting, lints, its
# tests and dependency checks (`rust`), and the native build with the package tests on each operating system (`native`). The
# eight-target build matrix is the `native build` workflow. Nothing here publishes, pushes or needs a secret.
name: native compiler

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "packages/compiler/**"
      - ".github/workflows/native-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  npm_config_fund: "false"
  npm_config_audit: "false"
  CARGO_TERM_COLOR: never

jobs:
  # The Rust compiler: formatting, lints and its own tests (the replay of the frozen corpus, the syntax-tree equality, the
  # property tests and the differentials against magic-string and the entity table). rust-toolchain.toml pins the compiler.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ci-

      - name: Install
        run: npm install

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Licenses, banned and duplicated crates, crate sources and advisories of the Rust dependency tree (deny.toml).
      - name: Dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The native compiler on each operating system: build the addon of the runner's own platform (and the WebAssembly fallback on
  # Linux), then run the package's tests (they fail when no binary loads). On Linux the
  # live differential (every JSX file of the repository against the TypeScript compiler) and a fuzz run follow. The eight-target build
  # matrix is the `native build` workflow, which the release uses.
  native:
    name: native compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu","windows","macos"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-native-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-native-${{ matrix.os }}-

      - name: Install
        run: npm install

      - name: Build the compiler package
        run: npm run build

      - name: Build the addon and the WebAssembly fallback
        run: npm run build:binaries -w @shadow-js/compiler

      - name: Package tests
        run: npx vitest run --project unit packages/compiler/test/native
