# Publishes @shadow-js/compiler, @shadow-js/core, @shadow-js/web, @shadow-js/vite to npm with provenance and creates the GitHub release. It runs on every push to main and publishes
# only the versions npm does not have yet, so releasing is: change the version, push. A push that changes no version ends after the first
# job. When a version is new, the addon for each platform and the WebAssembly build are built in the same run (native-build.yml) and the eight
# platform packages are published first, because the compiler lists them as optional dependencies. Needs the NPM_TOKEN secret (an
# organization secret works). Started by hand it can do a dry run.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and print what would be published, without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Which versions are not on npm yet
        id: plan
        run: node scripts/release.mjs plan

      # Fail here, before the long jobs, when the secret was not added.
      - name: Check that the npm token is set
        if: ${{ steps.plan.outputs.pending == 'true' && !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Add an npm automation token as the NPM_TOKEN secret of this repository (or of the organization), then run this workflow again."
            exit 1
          fi

  native:
    name: native binaries
    needs: plan
    if: ${{ needs.plan.outputs.pending == 'true' }}
    uses: ./.github/workflows/native-build.yml

  publish:
    name: publish
    needs: [plan, native]
    if: ${{ needs.plan.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    # The token is set for every step: npm sends it with the reads of the install too, and a placeholder token is refused by the registry.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Fail first, before the long steps, when the secret was not added.
      - name: Check that the npm token is set
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Add an npm automation token as the NPM_TOKEN secret of this repository (or of the organization), then run this workflow again."
            exit 1
          fi

      - name: Install
        run: node scripts/release.mjs install

      # The check runs on the committed manifest: a test requires it to list no platform package (they are not on the registry yet), so the
      # platform packages are linked after it, for the publish only.
      - name: Check (lint, typecheck, build, tests)
        run: npm run check

      - name: Fetch the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native-artifacts

      - name: Lay the binaries out as the platform packages
        run: |
          set -e
          for dir in native-artifacts/native-*; do
            name="${dir#native-artifacts/native-}"
            if [ "$name" = "wasm" ]; then
              mkdir -p packages/compiler/wasm
              cp -R "$dir"/. packages/compiler/wasm/
            else
              mkdir -p "packages/compiler/npm/$name"
              cp -R "$dir"/. "packages/compiler/npm/$name/"
            fi
          done
          ls packages/compiler/npm packages/compiler/wasm

      # The platform packages are not on the registry before this release, so the committed manifest does not list them; they are
      # written into this run's copy of the manifest, which is what gets checked and published.
      - name: Link the platform packages as optional dependencies
        run: node packages/compiler/scripts/link-platforms.mjs

      - name: Publish the platform packages first (dry run)
        if: ${{ inputs.dry_run }}
        run: node packages/compiler/scripts/publish-platforms.mjs --dry-run

      - name: Publish the platform packages first
        if: ${{ !inputs.dry_run }}
        run: node packages/compiler/scripts/publish-platforms.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: node scripts/release.mjs publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: node scripts/release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a release"
            exit 0
          fi
          notes=$(mktemp)
          awk -v v="$VERSION" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' packages/core/CHANGELOG.md > "$notes"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$notes"
